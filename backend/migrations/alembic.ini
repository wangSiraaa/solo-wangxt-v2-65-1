# offline Alembic migrations (env vars supply the database URL, same as the app)
[alembic]
script_location = %(here)s
prepend_sys_path = .
sqlalchemy.url = sqlite:///rlab.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
